name: Sync arXiv papers

on:
  schedule:
    - cron: '17 6 * * *'   # nightly, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch arXiv list
        run: python scripts/fetch_arxiv.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/arxiv.js && ! git ls-files --others --exclude-standard -- data/arxiv.js | grep -q .; then
            echo "No change."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arxiv.js
          git commit -m "Update arXiv paper list"
          git push
